[package]
name = "tools-layout"
description = "herdr-tools `layout` mode (formerly herdr-layouts)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tools_layout"
path = "src/lib.rs"

# The old plugin's own dependencies, minus toml_edit, which only its dropped
# `install-menu` used.
[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tools-core.workspace = true
fs4.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tools-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
