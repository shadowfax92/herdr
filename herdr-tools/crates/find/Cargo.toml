[package]
name = "tools-find"
description = "herdr-tools `find` mode (formerly herdr-jump)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tools_find"
path = "src/lib.rs"

# The old plugin's own dependencies, already in Cargo.lock so the port needs no
# lockfile change; drop any the port ends up not using.
[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tools-core.workspace = true
chrono.workspace = true
nucleo-matcher.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tools-core = { workspace = true, features = ["test-util"] }
static_assertions.workspace = true
