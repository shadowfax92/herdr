# Find's pickers (herdr-tools `find` mode). Each [[picker]] is one popup: a
# source of items, the shared fuzzy matcher, a row style, and what Enter does.
# This file is compiled into herdr-tools (include_str!).
#
# To add a picker (no Rust needed):
#   1. Copy the "paths" block below, give it a new id, and point `command` at
#      any program that prints one item per line.
#   2. Add a matching [[actions]] block to herdr-tools/herdr-plugin.toml, in
#      its `# --- find ---` block:
#        id = "find-<id>", command = ["./bin/herdr-tools", "find", "open", "<id>"]
#   3. Rebuild and reinstall (just -f herdr-tools/justfile install), then bind a
#      key in Herdr's config.toml:
#        [[keys.command]]
#        key = "alt+…"
#        type = "plugin_action"
#        command = "shadowfax.tools.find-<id>"
#
# Fields:
#   id       Picker name; `herdr-tools find open <id>` opens it.
#   action   Manifest action id that opens it (default "find-<id>"). It is
#            also the picker's popup key: `[popup.size]` and
#            `[[popup.profile]]` in shadowfax.tools' config.toml size it by
#            this name.
#   title    Popup heading.
#   source   "panes": the built-in pane navigator (only the panes picker uses it).
#   command  argv, run without a shell in the directory of the pane you came from.
#            Each output line is one item, in output order (ties keep that order).
#   origin   Optional name of the list's source, shown in the heading and in
#            errors (default: the command's program name, e.g. `zoxide`). Set
#            it when `command` is a wrapper such as `sh -c`.
#   kind     "text" (default) or "path": paths show ~ for $HOME, match the last
#            directory first, become absolute, and are typed shell-quoted if needed.
#   enter    What Enter does with the selected item, in order:
#            "paste" types it into the pane you came from (never presses Enter);
#            "copy" puts it on the clipboard.
#   empty    Optional message when the command prints nothing.
#   multi    true lets Tab (mark, move down) and Shift-Tab (mark, move up) pick
#            several items; marks survive searching. Enter then delivers every
#            mark in the order marked, joined by spaces (or the current item if
#            nothing is marked).
#   width    Optional popup width in terminal columns (default 110), 90% high,
#            used when config.toml sizes no popup for this picker's key. On a
#            narrower terminal the popup shrinks to keep 2 columns free on
#            each side.

[[picker]]
id = "panes"
action = "find"
title = "Jump to session"
source = "panes"
# 20% wider than the default, so the Name column doesn't come out of Task.
width = 132

[[picker]]
id = "paths"
title = "Paths"
command = ["zoxide", "query", "--list"]
kind = "path"
enter = ["paste", "copy"]
multi = true
empty = "zoxide has no directories yet. cd around and they appear here."

# The twin of `paths` for files: everything the recent-files CLI recorded (nvim
# opens, m_path copies), most recent first. The command runs without a shell in
# the Herdr server's environment, where ~/go/bin (`go install`'s default) may
# be missing from PATH, so sh also looks in the dirs nvim's integration checks.
# Deleted files are dropped, as zoxide drops deleted directories; the log keeps
# them. With no CLI the list is empty, so `empty` covers both cases.
[[picker]]
id = "recent-files"
title = "Recent files"
origin = "recent-files"
command = ["sh", "-c", '''
rf=$(command -v recent-files) || rf=
for dir in "$HOME/go/bin" "$HOME/.local/bin" /opt/homebrew/bin /usr/local/bin; do
  if [ -z "$rf" ] && [ -x "$dir/recent-files" ]; then rf=$dir/recent-files; fi
done
[ -n "$rf" ] || exit 0
# 90 days, as nvim's picker lists. A failure exits with the CLI's own status
# and stderr, which the popup shows.
out=$("$rf" list --days 90) || exit
# Split on newlines only, and never glob, so every path survives as written.
set -f
IFS='
'
for file in $out; do
  if [ -e "$file" ]; then printf '%s\n' "$file"; fi
done
''']
kind = "path"
enter = ["paste", "copy"]
multi = true
empty = "No recent files yet. nvim and m_path add them when the recent-files CLI is installed."
