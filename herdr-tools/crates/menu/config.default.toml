# The built-in menu: what `herdr-tools menu` shows when config.toml has no [menu]
# table. In config.toml these fields sit under [menu] ([[menu.items]]). Without
# a [popup.size].menu entry this menu is 68 cells wide and sized to its items.
title = "agent forks"
max_height = 24

[[items]]
type = "fork"
key = "l"
label = "fork current conversation left"
placement = "left"

[[items]]
type = "fork"
key = "r"
label = "fork current conversation right"
placement = "right"

[[items]]
type = "fork"
key = "t"
label = "fork current conversation top"
placement = "top"

[[items]]
type = "fork"
key = "b"
label = "fork current conversation bottom"
placement = "bottom"

[[items]]
type = "separator"

[[items]]
type = "rotate_fork"
key = "o"
label = "rotate last forked pane"

[[items]]
type = "separator"

[[items]]
type = "redistribute"
key = "d"
label = "redistribute panes…"

[[items]]
type = "copy_context"
key = "h"
label = "copy pane context"

[[items]]
type = "workspace_visibility"
key = "v"
label = "excluded workspaces"
