[package]
name = "tools-menu"
description = "herdr-tools `menu` mode (formerly herdr-menu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tools_menu"
path = "src/lib.rs"

# Test support only: `herdr-tools-menu menu <command>` is `herdr-tools menu
# <command>` for this crate's CLI tests, which cannot see the root package's
# binary through CARGO_BIN_EXE_*. Releases build only the root package.
[[bin]]
name = "herdr-tools-menu"
path = "tests/support/herdr_tools_menu.rs"
test = false
doc = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tools-core.workspace = true
fs4.workspace = true
# setsid for the detached scope-pick helper (src/scope.rs), as move's kill executor.
libc.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true

[dev-dependencies]
tools-core = { workspace = true, features = ["test-util"] }
