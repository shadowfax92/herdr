[package]
name = "tools-history"
description = "herdr-tools `history` mode (formerly herdr-talon)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tools_history"
path = "src/lib.rs"

# The old plugin's own dependencies, already in Cargo.lock so the port needs no
# lockfile change; drop any the port ends up not using.
[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tools-core.workspace = true
ansi-to-tui.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
unicode-segmentation.workspace = true
uuid.workspace = true

[dev-dependencies]
tools-core = { workspace = true, features = ["test-util"] }
