[package]
name = "tools-scratch"
description = "herdr-tools `scratch` mode (formerly herdr-scratch)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tools_scratch"
path = "src/lib.rs"

# The old plugin's own dependencies, already in Cargo.lock so the port needs no
# lockfile change; drop any the port ends up not using.
[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tools-core.workspace = true
libc.workspace = true
noyalib.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tools-core = { workspace = true, features = ["test-util"] }
