[package]
name = "tools-comment"
description = "herdr-tools `comment` mode (formerly herdr-comments)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tools_comment"
path = "src/lib.rs"

# The old plugin's own dependencies, already in Cargo.lock so the port needs no
# lockfile change; drop any the port ends up not using.
[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tools-core.workspace = true
ansi-to-tui.workspace = true
crossterm.workspace = true
noyalib.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[dev-dependencies]
tools-core = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
