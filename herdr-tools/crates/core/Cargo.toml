[package]
name = "tools-core"
description = "The shared Herdr seam for herdr-tools modes: host client, invocation, config, popup sizes, paths"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "tools_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
toml.workspace = true
tempfile = { workspace = true, optional = true }

[features]
# `tools_core::testing`: a fake Herdr socket and CLI for mode crates' tests.
# Mode crates enable it from [dev-dependencies] only.
test-util = ["dep:tempfile"]

[dev-dependencies]
tempfile.workspace = true
