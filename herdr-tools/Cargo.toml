# herdr-tools: one Herdr plugin (`shadowfax.tools`) and one program for the seven
# former shadowfax plugins. This is its own Cargo workspace, independent of the
# fork's root workspace: cargo stops its upward search here, and the root
# `Cargo.toml` never lists this directory.
[package]
name = "herdr-tools"
version = "0.1.0"
edition = "2021"
description = "Find, move, history, menu, comment, layout, and scratch tools for Herdr"
license = "MIT"
publish = false

[[bin]]
name = "herdr-tools"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
toml.workspace = true
tools-core.workspace = true
tools-find.workspace = true
tools-move.workspace = true
tools-history.workspace = true
tools-menu.workspace = true
tools-comment.workspace = true
tools-layout.workspace = true
tools-scratch.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# The union of the old plugins' dependencies, one version per crate. Where the
# old plugins disagreed, the newest compatible requirement won (see README).
[workspace.dependencies]
anyhow = "1.0"
ansi-to-tui = "8.0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
fs4 = "1"
libc = "0.2"
noyalib = "0.0.18"
nucleo-matcher = "0.3.1"
ratatui = "0.30.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6.5"
static_assertions = "1.1"
tempfile = "3.23"
thiserror = "2.0"
toml = "1.1"
toml_edit = { version = "0.24", features = ["serde"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { version = "1.22", features = ["v4"] }

tools-core = { path = "crates/core" }
tools-find = { path = "crates/find" }
tools-move = { path = "crates/move" }
tools-history = { path = "crates/history" }
tools-menu = { path = "crates/menu" }
tools-comment = { path = "crates/comment" }
tools-layout = { path = "crates/layout" }
tools-scratch = { path = "crates/scratch" }
